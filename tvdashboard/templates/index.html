<section class="panel quick-panel">
<div class="panel-head"><h2>Quick launch</h2><a class="small" href="/settings">Choose apps</a></div>
$quick
</section>
<section class="panel remote" id="remote-panel" tabindex="0" aria-label="TV remote" autofocus>
<div class="panel-head">
<h2>Remote</h2>
<button type="button" class="ghost" id="remote-release" hidden>Release keyboard</button>
</div>
<p class="muted hint">Click the remote, then use the keyboard. <kbd>Esc</kbd> sends Back;
<kbd>Shift</kbd>+<kbd>Esc</kbd> hands the keyboard back to this page.</p>
<form id="key-form" method="post" action="/api/key">
$keys
</form>
<form id="text-form" class="stack send" method="post" action="/api/text">
$text_field
</form>
</section>
<details class="panel">
<summary><h2>Screen</h2></summary>
$screenshot
</details>
<details class="panel">
<summary><h2>Devices</h2></summary>
$device
</details>
